<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fff;--bg2:#f5f6fa;--bg3:#ecedf3;--text:#27262b;--text2:#5c5962;--text3:#959396;--accent:#7253ed;--abg:#ecedf3;--border:#e6e1e8;--wbg:#fff3cd;--wb:#ffc107;--ibg:#d1ecf1;--ib:#0c7abf;--cbg:#f5f6fa;--sw:260px;--th:60px}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;font-size:14px;color:var(--text);background:var(--bg);display:flex;min-height:100vh}
#topbar{display:none;position:fixed;top:0;left:0;right:0;height:var(--th);background:var(--bg);border-bottom:1px solid var(--border);align-items:center;padding:0 20px;gap:12px;z-index:200}

#topbar-title{font-weight:600;font-size:14px}
#sidebar{width:var(--sw);min-height:100vh;background:var(--bg2);border-right:1px solid var(--border);position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;z-index:100;overflow-y:auto;transition:transform .25s,background .2s}
.sh{padding:28px 20px 16px;border-bottom:1px solid var(--border)}
.stag{font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:8px}
.stitle{font-size:18px;font-weight:700;color:var(--text);line-height:1.2;margin-bottom:4px}
.ssub{font-size:11px;color:var(--text3)}
nav{padding:10px 0;flex:1}
.ns{padding:12px 20px 4px;font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--text3)}
.nl{display:block;padding:8px 20px;color:var(--text2);text-decoration:none;font-size:13px;border-left:3px solid transparent;transition:all .15s;cursor:pointer;background:none;border-top:none;border-right:none;border-bottom:none;width:100%;text-align:left;font-family:inherit}
.nl:hover{background:var(--bg3);color:var(--text);border-left-color:var(--border)}
.nl.active{background:var(--abg);color:var(--accent);border-left-color:var(--accent);font-weight:500}
.slinks{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px}
.ext{font-size:11px;color:var(--text3);text-decoration:none;padding:5px 10px;border:1px solid var(--border);border-radius:4px;transition:all .15s}
.ext:hover{color:var(--accent);border-color:var(--accent);background:var(--abg)}
#main{margin-left:var(--sw);flex:1;min-width:0}

@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.sec:last-child{border-bottom:none}
#home{padding:80px 64px;background:linear-gradient(160deg,var(--bg2) 0%,var(--bg) 60%)}
.htag{font-size:11px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--accent);margin-bottom:16px}
.htitle{font-size:clamp(32px,5vw,52px);font-weight:700;color:var(--text);line-height:1.1;margin-bottom:16px}
.hdesc{font-size:15px;color:var(--text2);line-height:1.7;max-width:580px;margin-bottom:32px}
.hbtns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;font-size:13px;font-weight:500;text-decoration:none;border-radius:6px;border:1px solid var(--border);color:var(--text);background:var(--bg);transition:all .15s;font-family:inherit;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent);background:var(--abg)}
.bp{background:var(--accent);color:#fff;border-color:var(--accent)}
.bp:hover{background:#5e42c5;border-color:#5e42c5;color:#fff}
.team{margin-top:40px;padding-top:32px;border-top:1px solid var(--border)}
.tlabel{font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:5px 14px;border-radius:20px;background:var(--bg3);color:var(--text2);font-size:12px;font-weight:500}
h2{font-size:22px;font-weight:700;color:var(--text);margin-bottom:6px}
.sub{font-size:14px;color:var(--text3);margin-bottom:32px;padding-bottom:24px;border-bottom:1px solid var(--border)}
h3{font-size:15px;font-weight:600;color:var(--text);margin:28px 0 10px}
p{color:var(--text2);line-height:1.75;margin-bottom:14px}
p strong{color:var(--text);font-weight:600}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
ul,ol{padding-left:22px;margin-bottom:14px;color:var(--text2);line-height:1.8}
li{margin-bottom:3px}
code{background:var(--cbg);border:1px solid var(--border);padding:1px 6px;border-radius:3px;font-family:monospace;font-size:12px;color:var(--accent)}
pre{background:var(--cbg);border:1px solid var(--border);padding:20px;border-radius:6px;overflow-x:auto;font-family:monospace;font-size:12px;line-height:1.8;margin:16px 0}
table{width:100%;border-collapse:collapse;margin:16px 0;font-size:13px}
th{background:var(--bg2);padding:10px 14px;text-align:left;font-weight:600;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--text3);border:1px solid var(--border)}
td{padding:10px 14px;border:1px solid var(--border);color:var(--text2)}
tr:nth-child(even) td{background:var(--bg2)}
tr:hover td{color:var(--text)}
.cw{padding:14px 18px;margin:16px 0;border-radius:0 6px 6px 0;font-size:13px;line-height:1.7}
.cy{background:var(--wbg);border-left:4px solid var(--wb)}
.ci{background:var(--ibg);border-left:4px solid var(--ib)}
.cp{background:var(--abg);border-left:4px solid var(--accent)}
.cw strong{font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin:20px 0}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:20px;transition:border-color .15s}
.card:hover{border-color:var(--accent)}
.ci2{font-size:22px;margin-bottom:10px}
.ct{font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px}
.cd{font-size:12px;color:var(--text3);line-height:1.6}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.si{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:14px 16px;display:flex;align-items:center;gap:10px}
.sd{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.dg{background:#22c55e}.do{background:#f59e0b}.dr{background:#ef4444}
.st{font-size:12px;color:var(--text2)}
.st strong{color:var(--text);display:block;font-size:13px}
.mwrap{border:1px solid var(--border);border-radius:6px;overflow:hidden;margin:20px 0}
.mlabel{background:var(--bg2);padding:8px 14px;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);border-bottom:1px solid var(--border)}
.mwrap iframe{display:block;width:100%;height:480px;border:none}
.lwrap{border:1px solid var(--border);border-radius:6px;overflow:hidden;margin:20px 0;padding:20px;background:var(--bg2)}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.pc{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:20px;transition:border-color .15s}
.pc:hover{border-color:var(--accent)}
.pr{font-size:10px;color:var(--accent);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
.pn{font-size:14px;font-weight:600;color:var(--text);margin-bottom:6px}
.pd{font-size:12px;color:var(--text3);line-height:1.6;margin-bottom:10px}
.pm{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.mt{font-size:10px;padding:2px 8px;border:1px solid var(--border);color:var(--text3);border-radius:3px}
.ma{border-color:var(--accent);color:var(--accent)}
.steps{display:flex;flex-direction:column;gap:10px;margin:16px 0}
.step{background:var(--bg2);border:1px solid var(--border);border-radius:6px;display:flex;overflow:hidden}
.snum{min-width:48px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:#fff}
.sbody{padding:16px 20px}
.sbody h4{font-size:13px;font-weight:600;color:var(--text);margin-bottom:5px}
.sbody p{margin:0;font-size:13px}
.leg{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--text3)}
.li2{display:flex;align-items:center;gap:6px}
.ld{width:12px;height:12px;border-radius:2px;border:1px solid}
/* Breadcrumb nav */
.page-nav{display:flex;align-items:center;justify-content:space-between;padding:20px 64px;border-top:1px solid var(--border);margin-top:40px;max-width:860px}
.pnav-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;font-size:12px;font-weight:500;border:1px solid var(--border);border-radius:6px;color:var(--text2);cursor:pointer;background:var(--bg);font-family:inherit;transition:all .15s}
.pnav-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--abg)}
.pnav-btn:disabled{opacity:0.3;cursor:default;pointer-events:none}
.pnav-label{font-size:11px;color:var(--text3);text-align:center}
@media(max-width:800px){
  #topbar{display:flex}
  #sidebar{transform:translateX(-100%)}
  #sidebar.open{transform:translateX(0)}

  #home{padding:48px 24px}
  .sgrid,.pg{grid-template-columns:1fr}
  .page-nav{padding:20px 24px}
}
</style>

<template id="tpl-projet">
<section class="sec" id="projet">
  <h2>Le projet</h2>
  <p class="sub">Contexte, objectifs et cahier des charges</p>
  <div class="cw cy"><strong>⚠ État d'avancement :</strong> Par manque de temps, la machine n'a pas pu être finalisée. Cette documentation présente notre démarche complète, les problèmes rencontrés et ce qui aurait été fait avec plus de temps.</div>
  <h3>Contexte</h3>
  <p>Projet réalisé dans le cadre du <strong>Makerspace d'UniLaSalle Amiens</strong>. Objectif : concevoir et fabriquer une machine cartésienne pilotant un stylo sur deux axes X et Y via des moteurs pas-à-pas et le firmware GRBL-Servo.</p>
  <h3>État d'avancement</h3>
  <div class="sgrid">
    <div class="si"><div class="sd dg"></div><div class="st"><strong>Modélisation 3D</strong>Toutes les pièces sur Onshape</div></div>
    <div class="si"><div class="sd dg"></div><div class="st"><strong>Impression 3D</strong>Pièces imprimées (2 versions)</div></div>
    <div class="si"><div class="sd dg"></div><div class="st"><strong>Moteurs testés</strong>Ont tourné lors d'un test</div></div>
    <div class="si"><div class="sd do"></div><div class="st"><strong>Assemblage</strong>Pièces posées, non finalisé</div></div>
    <div class="si"><div class="sd dr"></div><div class="st"><strong>PCB custom</strong>3,3V non fonctionnel → abandonné</div></div>
    <div class="si"><div class="sd dr"></div><div class="st"><strong>Firmware & dessin</strong>Non atteint faute de temps</div></div>
  </div>
  <h3>Objectifs pédagogiques</h3>
  <ul>
    <li>Concevoir une machine CNC cartésienne de A à Z</li>
    <li>Maîtriser la modélisation 3D sur <strong>Onshape</strong></li>
    <li>Concevoir un PCB sur <strong>KiCad</strong></li>
    <li>Comprendre l'architecture Arduino + CNC Shield</li>
    <li>Documenter un projet technique de manière rigoureuse</li>
  </ul>
  <h3>Cahier des charges</h3>
  <table>
    <thead><tr><th>Domaine</th><th>Contrainte</th></tr></thead>
    <tbody>
      <tr><td>Matériaux</td><td>Planche contreplaqué fournie obligatoirement</td></tr>
      <tr><td>Électronique</td><td>Arduino et composants associés</td></tr>
      <tr><td>Logiciel</td><td>Arduino IDE, GitHub, Processing</td></tr>
      <tr><td>Précision</td><td>Traits précis et soignés</td></tr>
      <tr><td>Budget-temps</td><td>30 h par semestre en makerspace</td></tr>
    </tbody>
  </table>
</section>
</template>

<template id="tpl-conception">
<section class="sec" id="conception">
  <h2>Conception & pièces</h2>
  <p class="sub">Modélisation 3D Onshape et description des pièces imprimées</p>
  <p>Toutes les pièces ont été modélisées sur <strong>Onshape</strong>, assemblées virtuellement et exportées en STL pour impression 3D.</p>
  <div class="mwrap">
    <div class="mlabel">Assemblage complet — Vue 3D interactive</div>
    <iframe src="https://modelembedder.net/embed?did=e895d617fa85e3b715768f5c&wvm=v&wvmid=efa0b0bc12fe522d979fde8b&eid=5e27dc6e7103b2e81bcf4c4e&elementType=ASSEMBLY" allowfullscreen></iframe>
  </div>
  <h3>Structure de la machine</h3>
  <ul>
    <li>Châssis en <strong>contreplaqué perforé</strong> (fourni makerspace)</li>
    <li><strong>4 pieds de coin</strong> surélevant la planche pour le passage des courroies</li>
    <li><strong>Tiges lisses acier</strong> pour guidage linéaire (2 axes)</li>
    <li><strong>2 moteurs pas-à-pas</strong> pour déplacement X et Y</li>
    <li><strong>1 servo FS5103B</strong> pour la levée/abaissement du stylo</li>
  </ul>
  <h3>Pièces imprimées</h3>
  <div class="pg">
    <div class="pc"><div class="pr">Pièce · 01</div><div class="pn">Support moteur</div><div class="pd">Boîte ouverte logeant le moteur pas-à-pas. Trous ovales pour fixation, ouverture frontale pour axe et poulie.</div><div class="pm"><span class="mt ma">PLA · 30%</span><span class="mt">Axe X</span></div><a href="https://github.com/Makerspace-Amiens-2025-26/MachineThatDraws-Groupe08/blob/main/docs/images/support%20moteur.stl" target="_blank" style="font-size:11px">Voir STL ↗</a></div>
    <div class="pc"><div class="pr">Pièce · 02</div><div class="pn">Support moteur simple</div><div class="pd">Fixation compacte avec rainure centrale pour l'axe moteur et épaulement de butée.</div><div class="pm"><span class="mt ma">PLA · 30%</span><span class="mt">Axe Y</span></div><a href="https://github.com/Makerspace-Amiens-2025-26/MachineThatDraws-Groupe08/blob/main/docs/images/support%20moteur%20simple.stl" target="_blank" style="font-size:11px">Voir STL ↗</a></div>
    <div class="pc"><div class="pr">Pièce · 03</div><div class="pn">Support moteur double</div><div class="pd">Double appui latéral pour les extrémités à fort effort. Grande platine verticale avec deux bras.</div><div class="pm"><span class="mt ma">PLA · 35%</span><span class="mt">Effort élevé</span></div><a href="https://github.com/Makerspace-Amiens-2025-26/MachineThatDraws-Groupe08/blob/main/docs/images/support%20moteur%20double.stl" target="_blank" style="font-size:11px">Voir STL ↗</a></div>
    <div class="pc"><div class="pr">Pièce · 04</div><div class="pn">Support double poulie</div><div class="pd">Maintien des poulies de renvoi côté opposé aux moteurs. Deux poulies folles sous tension de courroie.</div><div class="pm"><span class="mt ma">PLA · 25%</span><span class="mt">×2</span></div><a href="https://github.com/Makerspace-Amiens-2025-26/MachineThatDraws-Groupe08/blob/main/docs/images/support%20double%20poulie.stl" target="_blank" style="font-size:11px">Voir STL ↗</a></div>
    <div class="pc"><div class="pr">Pièce · 05</div><div class="pn">Support barre métal</div><div class="pd">Pièce en L pour maintien des tiges lisses acier. Logement cylindrique et ergot d'alignement précis.</div><div class="pm"><span class="mt ma">PLA · 25%</span><span class="mt">×4</span></div><a href="https://github.com/Makerspace-Amiens-2025-26/MachineThatDraws-Groupe08/blob/main/docs/images/support%20barre%20me%CC%81tal.stl" target="_blank" style="font-size:11px">Voir STL ↗</a></div>
    <div class="pc"><div class="pr">Pièce · 06</div><div class="pn">Adaptateur</div><div class="pd">Cylindre creux solidarisant la poulie GT2 sur l'axe moteur sans jeu. 100% car soumis à torsion.</div><div class="pm"><span class="mt ma">PLA · 100%</span><span class="mt">×2</span></div><a href="https://github.com/Makerspace-Amiens-2025-26/MachineThatDraws-Groupe08/blob/main/docs/images/adaptateur.stl" target="_blank" style="font-size:11px">Voir STL ↗</a></div>
  </div>
  <h3>Récapitulatif</h3>
  <table>
    <thead><tr><th>Pièce</th><th>Qté</th><th>Remplissage</th><th>Fonction</th></tr></thead>
    <tbody>
      <tr><td>Support moteur</td><td>1</td><td>30%</td><td>Logement moteur axe X</td></tr>
      <tr><td>Support moteur simple</td><td>1</td><td>30%</td><td>Fixation moteur axe Y</td></tr>
      <tr><td>Support moteur double</td><td>1</td><td>35%</td><td>Fixation renforcée</td></tr>
      <tr><td>Support double poulie</td><td>2</td><td>25%</td><td>Renvoi de courroie</td></tr>
      <tr><td>Support barre métal</td><td>4</td><td>25%</td><td>Maintien tiges guidage</td></tr>
      <tr><td>Adaptateur</td><td>2</td><td>100%</td><td>Liaison axe/poulie</td></tr>
      <tr><td>Pieds de coin</td><td>4</td><td>20%</td><td>Rigidité châssis</td></tr>
    </tbody>
  </table>
</section>
</template>

<template id="tpl-electronique">
<section class="sec" id="electronique">
  <h2>Électronique</h2>
  <p class="sub">Architecture, composants et PCB KiCad</p>
  <h3>Architecture générale</h3>
  <pre>[PC — Processing / UGS]
         │ USB
         ▼
  [Arduino Uno + CNC Shield v3]
         │
    ┌────┴────────────────┐          │
    │                     │          │

<template id="tpl-difficultes">
<section class="sec" id="difficultes">
  <h2>Difficultés rencontrées</h2>
  <p class="sub">Problèmes, causes identifiées et solutions</p>
  <h3>1. PCB custom — 3,3V absent</h3>
  <p><strong>Problème :</strong> Notre PCB KiCad ne délivrait pas le 3,3V en sortie lors des tests physiques.</p>
  <p><strong>Hypothèses :</strong> Composant défectueux sur le régulateur, erreur de routage, ou mauvaise soudure.</p>
  <p><strong>Solution adoptée :</strong> Abandon du PCB, adoption d'Arduino Uno + CNC Shield v3.</p>
  <p><strong>Avec plus de temps :</strong> Diagnostic au multimètre en sortie du régulateur, correction et refabrication du PCB.</p>
  <h3>2. Moteurs qui vibrent sans tourner</h3>
  <p><strong>Problème :</strong> Les moteurs pas-à-pas vibraient mais ne tournaient pas lors des premiers tests.</p>
  <p><strong>Causes :</strong> Courant insuffisant sur le driver A4988 (Vref trop basse), ou paire de bobines inversée dans le connecteur.</p>
  <p><strong>Solution envisagée :</strong> Mesurer Vref au multimètre → ajuster à 1,2V. Vérifier la continuité des bobines.</p>
  <p><strong>État :</strong> Les moteurs ont tourné lors d'un test mais le problème n'a pas été résolu de façon stable.</p>
  <h3>3. Erreurs dimensionnelles — pièces imprimées</h3>
  <p><strong>Problème 1 — Trous de visserie M3 trop petits :</strong> Rétreint du PLA. Correction : +0,3 mm dans Onshape, réimpression.</p>
  <p><strong>Problème 2 — Logement des tiges trop serré :</strong> Diamètre mesuré au pied à coulisse. Correction : +0,2 mm de jeu, réimpression.</p>
  <div class="cw ci"><strong>ℹ Leçon apprise :</strong> Toujours prévoir 0,2–0,3 mm de jeu sur les trous de visserie et logements d'insertion en PLA.</div>
</section>

<script>
const pages = ['home','projet','conception','electronique','programmation','impression','cablage','difficultes','suite'];
const labels = {
  home:'🏠 Accueil',
  projet:'📋 Le projet',
  conception:'⚙️ Conception & pièces',
  electronique:'⚡ Électronique',
  programmation:'💻 Programmation',
  impression:'🖨 Imprimer & Assembler',
  cablage:'🔌 Câbler & Souder',
  difficultes:'⚠️ Difficultés rencontrées',
  suite:'🔭 Aller plus loin'
};

let current = 'home';

function navigate(page, btn) {
  current = page;
  // Update sidebar active state
  document.querySelectorAll('.nl').forEach(a => a.classList.remove('active'));
  if (btn) {
    btn.classList.add('active');
  } else {
    document.querySelectorAll('.nl').forEach(a => {
      if (a.getAttribute('onclick') && a.getAttribute('onclick').includes("'"+page+"'")) {
        a.classList.add('active');
      }
    });
  }
  // Close sidebar on mobile
  document.getElementById('sidebar').classList.remove('open');
  // Render page
  renderPage(page);
  // Scroll to top
  window.scrollTo(0,0);
  // Update hash
  history.pushState(null, '', '#' + page);
}

function renderPage(page) {
  const tpl = document.getElementById('tpl-' + page);
  const container = document.getElementById('page-content');
  container.innerHTML = '';
  if (tpl) {
    container.appendChild(tpl.content.cloneNode(true));
  }
  // Add bottom navigation
  const idx = pages.indexOf(page);
  const nav = document.createElement('div');
  nav.className = 'page-nav';
  const prev = idx > 0 ? pages[idx-1] : null;
  const next = idx < pages.length-1 ? pages[idx+1] : null;
  nav.innerHTML = `
    <button class="pnav-btn" onclick="navigate('${prev||''}',null)" ${!prev?'disabled':''}>← ${prev ? labels[prev] : ''}</button>
    <span class="pnav-label">${idx+1} / ${pages.length}</span>
    <button class="pnav-btn" onclick="navigate('${next||''}',null)" ${!next?'disabled':''}>→ ${next ? labels[next] : ''}</button>
  `;
  container.appendChild(nav);
  // Trigger fade animation
  container.style.animation = 'none';
  container.offsetHeight;
  container.style.animation = '';
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

// Init: load from hash or default
window.addEventListener('load', () => {
  const hash = location.hash.replace('#','');
  const page = pages.includes(hash) ? hash : 'home';
  navigate(page, null);
});

window.addEventListener('popstate', () => {
  const hash = location.hash.replace('#','');
  const page = pages.includes(hash) ? hash : 'home';
  navigate(page, null);
});
</script>
